<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Файл полностью автономный: ни одного обращения в интернет.
     CSP ниже запрещает браузеру загружать что-либо извне в принципе. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src local; form-action 'none'; base-uri 'none'">
<title>Spontaneous Speaking — Task Lab</title>
<style>
:root{
  --bg:#17132b; --bg2:#221c3f; --panel:#2b2450; --panel2:#332a5e;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ink:#f4f1ff; --muted:#b9b0d8; --dim:#8d84ad;
  --orange:#f59e0b; --orange2:#fbbf24; --green:#4ade80; --green2:#34d399;
  --lav:#a78bfa; --cream:#f7f6ef; --red:#fb7185;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 800px at 50% -10%,#2a2250 0%,var(--bg) 70%);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100%;
}
.serif{font-family:Georgia,"Times New Roman",serif}
#app{max-width:1180px;margin:0 auto;padding:22px 18px 70px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.19em;
  text-transform:uppercase;color:var(--lav);font-weight:700}
.brand .sp{font-size:14px}
.topbar .spacer{flex:1}
.coinbox{display:flex;align-items:center;gap:8px;background:rgba(245,158,11,.12);
  border:1px solid rgba(245,158,11,.35);color:var(--orange2);
  padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;
  border-radius:999px;padding:12px 26px;transition:transform .12s ease,filter .12s ease}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn:active{transform:translateY(0)}
.btn-green{background:linear-gradient(180deg,var(--green) 0%,var(--green2) 100%);color:#0d2b1d}
.btn-orange{background:linear-gradient(180deg,var(--orange2) 0%,var(--orange) 100%);color:#3a2405}
.btn-ghost{background:rgba(255,255,255,.07);color:var(--muted);border:1px solid var(--line2)}
.btn-sm{padding:9px 18px;font-size:13.5px}
.btn-xs{padding:6px 14px;font-size:12.5px;border-radius:999px}

/* ---------- hub ---------- */
.hero{text-align:center;padding:12px 0 30px}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.03;font-weight:800;letter-spacing:-.02em}
.hero h1 .accent{color:var(--orange);font-style:italic;font-family:Georgia,serif}
.hero p.lead{color:var(--muted);font-style:italic;margin-top:14px;font-size:16.5px}
.hero .meta{margin-top:16px;color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}
.tcard{background:linear-gradient(160deg,var(--panel) 0%,#241e46 100%);
  border:1px solid var(--line);border-radius:18px;padding:20px 19px 17px;cursor:pointer;
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;position:relative;overflow:hidden}
.tcard:hover{transform:translateY(-3px);border-color:rgba(167,139,250,.5);
  box-shadow:0 14px 34px rgba(0,0,0,.36)}
.tcard .num{position:absolute;top:14px;right:16px;font-size:12px;color:var(--dim);font-weight:700}
.tcard .ico{font-size:27px;margin-bottom:11px}
.tcard h3{font-size:18.5px;font-weight:750;letter-spacing:-.01em}
.tcard .sub{color:var(--dim);font-size:12.5px;margin-top:5px;text-transform:uppercase;letter-spacing:.07em}
.tcard .skill{color:var(--muted);font-size:13.5px;margin-top:12px;line-height:1.45}
.tcard .time{margin-top:13px;display:inline-block;font-size:12px;color:var(--green);
  background:rgba(74,222,128,.10);border:1px solid rgba(74,222,128,.28);
  padding:4px 11px;border-radius:999px;font-weight:700}

/* ---------- rules panel ---------- */
.panel{background:rgba(255,255,255,.045);border:1px solid var(--line);
  border-radius:18px;padding:22px 24px;margin:0 auto;max-width:640px;text-align:left}
.panel h4{display:flex;align-items:center;gap:9px;font-size:12.5px;letter-spacing:.17em;
  text-transform:uppercase;color:var(--orange);margin-bottom:16px;font-weight:800}
ol.steps{list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:13px;margin-bottom:12px;
  color:var(--ink);font-size:14.6px;line-height:1.5}
ol.steps li:last-child{margin-bottom:0}
ol.steps li::before{content:counter(s);flex:none;width:23px;height:23px;border-radius:50%;
  background:var(--orange);color:#3a2405;font-size:12.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin-top:1px}

/* ---------- generic screen ---------- */
.screen-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.screen-head h2{font-size:27px;font-weight:780;letter-spacing:-.02em}
.screen-head .tag{color:var(--dim);font-size:13px;margin-top:4px}
.center{text-align:center}
.wrap-narrow{max-width:760px;margin:0 auto}
.stage{background:linear-gradient(160deg,#2a2350 0%,#221c44 100%);border:1px solid var(--line);
  border-radius:22px;padding:34px 28px;text-align:center;min-height:250px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.phase-label{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:800}
.phase-label.hot{color:var(--orange)}
.phase-label.go{color:var(--green)}
.bigtime{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden;width:min(430px,80%)}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green2));
  width:100%;transition:width .25s linear}
.bar.warn > i{background:linear-gradient(90deg,var(--orange2),var(--orange))}
.banner{display:flex;align-items:center;gap:9px;justify-content:center;
  background:rgba(245,158,11,.13);border:1px solid rgba(245,158,11,.36);
  color:var(--orange2);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:650}
.banner.lock{background:rgba(251,113,133,.11);border-color:rgba(251,113,133,.34);color:#fda4af}
.hint{color:var(--dim);font-size:13.5px;line-height:1.6}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}

/* ---------- stimulus displays ---------- */
.emoji-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.emoji-row span{font-size:clamp(38px,8vw,64px);line-height:1;
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;animation:pop .3s ease both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.word-row{display:flex;gap:13px;justify-content:center;flex-wrap:wrap}
.word-row span{font-size:clamp(20px,3.4vw,30px);font-weight:700;padding:12px 22px;
  border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line2);
  animation:pop .3s ease both}
.word-row span.n1{color:#fbbf24}.word-row span.n2{color:#4ade80}.word-row span.n3{color:#a78bfa}
.word-row span.n4{color:#67e8f9}.word-row span.n5{color:#fda4af}
.chips{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.chip{background:var(--green);color:#0d2b1d;font-weight:700;font-size:14px;
  padding:8px 17px;border-radius:999px}
.chip.o{background:rgba(245,158,11,.16);color:var(--orange2);border:1px solid rgba(245,158,11,.4)}
.chip.g{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line2)}
.chip.used{background:rgba(74,222,128,.16);color:var(--green);border:1px solid rgba(74,222,128,.45);
  text-decoration:line-through}
.chip.tap{cursor:pointer}
.chip.tap:hover{filter:brightness(1.12)}
.scene{font-family:Georgia,serif;font-size:clamp(19px,3vw,27px);line-height:1.42;max-width:640px}
.scene .em{color:var(--orange2)}
.roleface{font-size:60px;line-height:1;margin-bottom:6px}
.rolename{font-family:Georgia,serif;font-size:30px;font-weight:600}

/* ---------- pick grid (Portrait-quiz style) ---------- */
.pickwrap{background:var(--cream);border-radius:22px;padding:26px 22px;color:#221c3f}
.pickwrap h3{text-align:center;font-family:Georgia,serif;font-size:25px;font-weight:600}
.pickwrap .ps{text-align:center;color:#6b6485;font-size:13px;margin:5px 0 20px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
@media(min-width:560px){.pgrid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){.pgrid{grid-template-columns:repeat(6,1fr)}}
.pcard{background:#1e1b3a;border-radius:13px;aspect-ratio:3/4;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  transition:transform .13s ease,box-shadow .13s ease;border:1px solid #2f2b52}
.pcard:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(0,0,0,.28)}
.pcard .n{position:absolute;top:8px;left:10px;font-size:11px;color:#5f5a86;font-weight:700}
.pcard .q{font-size:23px;opacity:.85}
.pcard .t{font-size:9.5px;letter-spacing:.13em;color:#6f699a;text-transform:uppercase;font-weight:700}
.pcard.taken{opacity:.34;pointer-events:none}
.pcard.taken .t{color:#4ade80}

/* ---------- misc ---------- */
.sel{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sel button{background:rgba(255,255,255,.06);border:1px solid var(--line2);color:var(--muted);
  padding:8px 16px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:650}
.sel button.on{background:var(--lav);border-color:var(--lav);color:#1b1235}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;width:100%;max-width:640px}
.acard{background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:15px;
  padding:20px 16px;text-align:center}
.acard .qn{font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.acard .av{font-family:Georgia,serif;font-size:20px;margin-top:9px;color:var(--ink)}
.acard .ah{font-size:12px;color:var(--lav);margin-top:11px;line-height:1.45;display:none}
.acard.revealed .ah{display:block}
.twist{background:linear-gradient(160deg,#3b1d3d,#2a1533);border:1px solid rgba(251,113,133,.45);
  border-radius:20px;padding:30px 34px;animation:flash .45s ease both}
@keyframes flash{from{opacity:0;transform:scale(.85) rotate(-3deg)}to{opacity:1;transform:none}}
.twist .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#fda4af;font-weight:800}
.twist .val{font-family:Georgia,serif;font-size:clamp(26px,5vw,40px);margin-top:9px}
.dots{display:flex;gap:7px;justify-content:center;margin-top:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.16)}
.dots i.on{background:var(--green)}
.rubric{display:grid;gap:13px;max-width:520px;margin:0 auto;text-align:left}
.rrow{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.rrow span{font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.rrow span i{font-style:normal;font-size:11.5px;color:var(--dim)}
.rrow .rbtns{display:flex;gap:6px}
.rrow .rbtns button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);
  background:rgba(255,255,255,.05);color:var(--muted);cursor:pointer;font-family:inherit;font-weight:700}
.rrow .rbtns button:hover{border-color:var(--lav)}
.rrow .rbtns button.on{background:var(--lav);color:#1b1235;border-color:var(--lav)}

/* поле «кто отвечал» */
.who{width:100%;margin-bottom:16px;padding:11px 14px;border-radius:11px;
  border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--ink);
  font-family:inherit;font-size:14px}
.who::placeholder{color:var(--dim)}
.who:focus{outline:none;border-color:var(--lav)}

/* итоговый балл */
.markbox{display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-top:18px;padding:15px 18px;border-radius:14px;
  background:rgba(255,255,255,.05);border:1px solid var(--line2)}
.markbox .ml{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:800}
.markbox .mw{font-size:13px;color:var(--muted);margin-top:3px}
.mv{font-size:38px;font-weight:800;line-height:1;color:var(--dim)}
.mv.m5{color:#4ade80}.mv.m4{color:#a3e635}.mv.m3{color:#fbbf24}
.mv.m2{color:#fb923c}.mv.m1{color:#fb7185}

/* журнал занятия */
.jt{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.jt th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line2)}
.jt td{padding:11px 10px;border-bottom:1px solid var(--line);color:var(--ink);text-align:left}
.jt td:last-child,.jt th:last-child{text-align:right}
.jt tr.sum td{color:var(--muted);font-weight:700;border-bottom:0}
.jt td i{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:2px}
.jrn .hint{max-width:520px}
button.coinbox{cursor:pointer;font-family:inherit}
button.coinbox:hover{filter:brightness(1.15)}
.foot{margin-top:44px;text-align:center;color:var(--dim);font-size:12px;line-height:1.7}
.foot b{color:var(--muted);font-weight:650}
.sr{position:absolute;left:-9999px}

/* переключатель языка */
.langsw{display:flex;gap:4px;background:rgba(255,255,255,.05);border:1px solid var(--line2);
  border-radius:999px;padding:3px}
.langsw button{border:0;background:transparent;color:var(--dim);cursor:pointer;font-family:inherit;
  font-size:12px;font-weight:800;letter-spacing:.06em;padding:6px 12px;border-radius:999px}
.langsw button.on{background:var(--lav);color:#1b1235}

/* тематическая рамка */
.framebar{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.framebar > span{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);font-weight:800}
.framebar .sel button[data-frame].on{background:var(--orange);border-color:var(--orange);color:#3a2405}

/* запрос к модели */
.promptbox{font-size:13.5px;line-height:1.6;color:var(--muted);font-style:italic;
  background:rgba(255,255,255,.04);border-left:2px solid var(--orange);
  padding:12px 15px;border-radius:0 10px 10px 0}
@media (max-width:560px){
  .stage{padding:26px 16px}
  #app{padding:16px 12px 60px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   SPONTANEOUS SPEAKING — TASK LAB
   Стимульные банки собраны по четырём требованиям отбора:
   семантическая открытость · отсутствие готового сюжета ·
   культурная нейтральность · лексическая доступность (ядро B1)
   ===================================================================== */

/* --- Тематические рамки, заданные в статье ---------------------------------
   «Тематика: деловые переговоры, поездки, учебные ситуации».
   Рамка задаётся косвенно, через подбор стимулов: один-два элемента набора
   отсылают к рамке, остальные от неё удалены. Требование «отсутствие готового
   сюжета» при этом сохраняется — элементы внутри набора не складываются
   в историю сами собой.
   N = деловые переговоры · T = поездки · S = учебные ситуации              */
const FRAMES = {
  N:{ru:'Деловые переговоры', en:'Business negotiations'},
  T:{ru:'Поездки',            en:'Travel'},
  S:{ru:'Учебные ситуации',   en:'Study situations'}
};

/* --- 1. EMOJI STORY SPRINT: 15 последовательностей, по 5 на рамку --- */
const EMOJI_SETS = [
  {f:'N', v:["📊","🐌","☂️","🔑","🎻"]},
  {f:'N', v:["🤝","🌋","🧊","📻","🪜"]},
  {f:'N', v:["💼","🍄","🎠","⚓","🌪️"]},
  {f:'N', v:["📝","🐘","🕯️","🛼","🧀"]},
  {f:'N', v:["🏢","🪁","🐟","🔦","🍯"]},
  {f:'T', v:["🧳","🐝","📡","🍋","🪞"]},
  {f:'T', v:["✈️","🧵","🪨","🎂","🦉"]},
  {f:'T', v:["🗺️","❄️","🥁","🧴","🚪"]},
  {f:'T', v:["🎫","🌵","🖨️","🐧","🕰️"]},
  {f:'T', v:["🚂","🍞","🪫","🎪","🧭"]},
  {f:'S', v:["📚","🌧️","☕","🚲","🏠"]},
  {f:'S', v:["🎓","🐌","🔌","🌻","🧯"]},
  {f:'S', v:["📓","🛰️","🍉","🥾","🔔"]},
  {f:'S', v:["🔬","🎈","🧦","🌉","🪃"]},
  {f:'S', v:["✏️","🐘","🛎️","🍄","🛶"]}
];

/* --- 2. WORD EXPLOSION: 15 наборов B2 по 5 существительных --------------
   Внутри набора слова из разных тематических групп и не однокоренные;
   рамку задаёт одно слово, остальные от него семантически удалены.      */
const WORDS_B2 = [
  {f:'N', v:["contract","jellyfish","chimney","applause","gravel"]},
  {f:'N', v:["invoice","glacier","feather","ladder","whisper"]},
  {f:'N', v:["deadline","orchard","siren","thumb","mirror"]},
  {f:'N', v:["budget","cactus","ribbon","lighthouse","argument"]},
  {f:'N', v:["warehouse","thunder","saddle","pearl","envelope"]},
  {f:'T', v:["suitcase","echo","chandelier","quarrel","pebble"]},
  {f:'T', v:["harbour","insult","kettle","statistics","moss"]},
  {f:'T', v:["compass","balcony","penalty","moth","yeast"]},
  {f:'T', v:["crossroads","violin","bandage","dust","staircase"]},
  {f:'T', v:["tunnel","portrait","avalanche","receipt","beehive"]},
  {f:'S', v:["laboratory","fence","lullaby","tide","coupon"]},
  {f:'S', v:["spreadsheet","canyon","marble","hiccup","sailor"]},
  {f:'S', v:["poetry","helmet","greenhouse","bargain","owl"]},
  {f:'S', v:["blueprint","wardrobe","drought","referee","cinnamon"]},
  {f:'S', v:["telescope","anchor","rumour","blanket","harvest"]}
];
/* B1: три слова вместо пяти, показ восемь секунд (вариант из статьи) */
const WORDS_B1 = [
  {f:'N', v:["office","rabbit","ticket"]},   {f:'N', v:["meeting","honey","shoes"]},
  {f:'N', v:["money","garden","letter"]},    {f:'N', v:["boss","apple","mirror"]},
  {f:'T', v:["train","river","phone"]},      {f:'T', v:["hotel","mountain","key"]},
  {f:'T', v:["airport","bicycle","cheese"]}, {f:'T', v:["map","desert","spoon"]},
  {f:'S', v:["exam","library","fish"]},      {f:'S', v:["teacher","storm","coin"]},
  {f:'S', v:["homework","forest","envelope"]},{f:'S', v:["classroom","ocean","drum"]}
];

/* --- 3. ONE PHOTO — THREE STORIES ---------------------------------------
   Первая сцена — та, что названа в статье: зал вылета аэропорта в час пик. */
const SCENES = [
  {f:'T', ico:"🛫", txt:"An airport departure hall at rush hour. A woman is standing completely still in the middle of the moving crowd."},
  {f:'T', ico:"🧳", txt:"A hotel lobby at three in the morning. A single suitcase is standing by the reception desk."},
  {f:'T', ico:"🚉", txt:"A railway platform. The train is leaving and two people are still standing there, not looking at each other."},
  {f:'T', ico:"🛂", txt:"A queue at passport control that has not moved for twenty minutes."},
  {f:'N', ico:"💻", txt:"A meeting room. Eleven people are looking at one closed laptop in the middle of the table."},
  {f:'N', ico:"🌙", txt:"An open-plan office at nine in the evening. One desk lamp is on and there are two coffee cups on the same table."},

const rnd  = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]];} return b; };
const mmss = s => Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function h(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function clearTimers(){ S.timers.forEach(t=>clearInterval(t)); S.timers=[]; stopAudio(); }
function markerHit(){ S.markers++; refreshJournal(); }
function refreshJournal(){
  document.querySelectorAll('[data-jn]').forEach(e=>e.textContent=S.log.length);
}
/* балл 1-5: среднее по четырём параметрам, 5 — высший */
function finalMark(scores){
  const filled = scores.filter(v=>v>0);
  if(!filled.length) return 0;
  return Math.max(1, Math.min(5, Math.round(filled.reduce((a,b)=>a+b,0)/filled.length)));
}
function markWord(m){ return T.markWords[LANG][m] || ''; }

/* countdown: returns a stop() handle */
function countdown(secs, onTick, onDone){
  let left = secs;
  onTick(left, secs);
  const id = setInterval(()=>{
    left--;
    onTick(Math.max(0,left), secs);
    if(left<=0){ clearInterval(id); S.timers = S.timers.filter(t=>t!==id); onDone && onDone(); }
  },1000);
  S.timers.push(id);
  return ()=>{ clearInterval(id); S.timers = S.timers.filter(t=>t!==id); };
}

/* ---------- stage builder ---------- */
function makeStage(host, labelText){
  const st = h(`<div class="stage">
      <div class="phase-label" data-label>${labelText||''}</div>
      <div data-slot style="width:100%;display:flex;flex-direction:column;align-items:center;gap:20px"></div>
      <div data-timer style="display:none;flex-direction:column;align-items:center;gap:12px;width:100%">
        <div class="bigtime" data-big>0:00</div>
        <div class="bar" data-bar><i></i></div>
      </div>
    </div>`);
  host.appendChild(st);
  const api = {
    root: st,
    label: (t,cls)=>{ const e=st.querySelector('[data-label]'); e.textContent=t; e.className='phase-label '+(cls||''); },
    slot:  st.querySelector('[data-slot]'),
    set:   nodeOrHtml=>{ api.slot.innerHTML=''; api.add(nodeOrHtml); },
    add:   n=>{ api.slot.appendChild(typeof n==='string'?h(n):n); },
    timer(on){ st.querySelector('[data-timer]').style.display = on?'flex':'none'; },
    tick(left,total,warn){
      st.querySelector('[data-big]').textContent = mmss(left);
      const bar = st.querySelector('[data-bar]');
      bar.classList.toggle('warn', !!warn);
      bar.querySelector('i').style.width = (total? (left/total*100):0)+'%';
    }
  };
  return api;
}

/* ---------- discourse-marker bonus strip (rubric parameter 4) ---------- */
function markerStrip(kind){
  S.markers = 0;   /* счётчик обнуляется на каждое выступление */
  const wrap = h(`<div style="width:100%">
      <div class="hint" style="margin-bottom:9px">${t('markerHint')}</div>
      <div class="chips" data-mk></div></div>`);
  const box = wrap.querySelector('[data-mk]');
  MARKERS[kind].forEach(m=>{
    const c = h(`<span class="chip o tap">“${m}”</span>`);
    c.onclick = ()=>{ if(c.classList.contains('used'))return; c.classList.add('used'); markerHit(); };
    box.appendChild(c);
  });
  return wrap;
}

/* ---------- end-of-turn rubric (4 параметра оценивания) ---------- */
function rubricPanel(onDone){
  const scores = [0,0,0,0];
  const suggested = Math.max(1, Math.min(5, S.markers + 1));   /* подсказка по числу маркеров */
  const p = h(`<div class="panel" style="max-width:600px">
      <h4>${t('rateTurn')}</h4>
      <input class="who" data-who placeholder="${t('whoSpeaking')}">
      <div class="rubric" data-r></div>
      <div class="markbox">
        <div>
          <div class="ml">${t('finalMark')}</div>
          <div class="mw" data-word>${t('setRows')}</div>
        </div>
        <div class="mv" data-mark>—</div>
      </div>
      <div class="controls">
        <button class="btn btn-green btn-sm" data-ok>${t('saveJournal')}</button>
        <button class="btn btn-ghost btn-sm" data-skip>${t('skip')}</button>
      </div>
    </div>`);
  const box = p.querySelector('[data-r]');

  const recalc = ()=>{
    const m = finalMark(scores);
    p.querySelector('[data-mark]').textContent = m || '—';
    p.querySelector('[data-mark]').className = 'mv m'+(m||0);
    p.querySelector('[data-word]').textContent = m ? (markWord(m)+' · '+t('isHighest')) : t('setRows');
  };

  RUBRIC.forEach((r,i)=>{
    const hint = (i===3 && S.markers) ? ` · ${S.markers} ${t('heard')}` : '';
    const row = h(`<div class="rrow"><span><b>${r[LANG]}</b><i>${L(r,'note')}${hint}</i></span><div class="rbtns"></div></div>`);
    const bt = row.querySelector('.rbtns');
    [1,2,3,4,5].forEach(v=>{
      const b=h(`<button>${v}</button>`);
      b.onclick=()=>{ scores[i]=v; bt.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); recalc(); };
      if(i===3 && v===suggested && S.markers){ scores[3]=v; b.classList.add('on'); }
      bt.appendChild(b);
    });
    box.appendChild(row);
  });
  recalc();

  p.querySelector('[data-ok]').onclick = ()=>{
    const m = finalMark(scores);
    if(!m){ p.querySelector('[data-word]').textContent = t('giveMark'); return; }
    const now = new Date();
    const two = n => String(n).padStart(2,'0');
    S.log.push({
      who: (p.querySelector('[data-who]').value || '').trim() || ('Student ' + (S.log.length+1)),
      task: S.task || '—', scores: scores.slice(), mark: m, markers: S.markers,
      time: two(now.getHours())+':'+two(now.getMinutes()),
      date: two(now.getDate())+'.'+two(now.getMonth()+1)+'.'+now.getFullYear()
    });
    saveLog(); refreshJournal(); onDone();
  };
  p.querySelector('[data-skip]').onclick = onDone;
  return p;
}

/* =====================================================================
   WEB AUDIO — синтез звуковых сцен для Mystery Sound
   ===================================================================== */
function ctx(){
  if(!S.audio){ try{ S.audio = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(S.audio.state==='suspended') S.audio.resume();
  return S.audio;
}
let AUDIO_NODES = [];
function stopAudio(){ AUDIO_NODES.forEach(n=>{ try{n.stop?n.stop():n.disconnect();}catch(e){} }); AUDIO_NODES=[]; }
function noiseBuf(c, sec, brown){
  const b = c.createBuffer(1, Math.max(1,Math.floor(c.sampleRate*sec)), c.sampleRate);
  const d = b.getChannelData(0); let last=0;
  for(let i=0;i<d.length;i++){
    const w = Math.random()*2-1;
    if(brown){ last=(last+0.02*w)/1.02; d[i]=last*3.2; } else d[i]=w;
  }
  return b;
}
function grain(c, dest, at, dur, freqLo, freqHi, gain, brown){
  const src=c.createBufferSource(); src.buffer=noiseBuf(c,dur,brown);
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=(freqLo+freqHi)/2;
  bp.Q.value=Math.max(.4,(freqLo+freqHi)/2/Math.max(1,(freqHi-freqLo)));
  const g=c.createGain(); g.gain.setValueAtTime(0,at);
  g.gain.linearRampToValueAtTime(gain,at+0.004);
  g.gain.exponentialRampToValueAtTime(0.0005,at+dur);
  src.connect(bp).connect(g).connect(dest); src.start(at); src.stop(at+dur+0.02);
  AUDIO_NODES.push(src); return src;
}
function tone(c, dest, at, dur, freq, gain, type, decay){
  const o=c.createOscillator(); o.type=type||'sine'; o.frequency.setValueAtTime(freq,at);
  const g=c.createGain(); g.gain.setValueAtTime(0,at);
  g.gain.linearRampToValueAtTime(gain,at+0.012);
  if(decay) g.gain.exponentialRampToValueAtTime(0.0005,at+dur);
  else { g.gain.setValueAtTime(gain,at+dur-0.03); g.gain.linearRampToValueAtTime(0,at+dur); }
  o.connect(g).connect(dest); o.start(at); o.stop(at+dur+0.05);
  AUDIO_NODES.push(o); return o;
}
function playRecipe(name, dur){
  const c = ctx(); if(!c) return false;
  stopAudio();
  dur = dur || 8;
  const t0 = c.currentTime + 0.06;
  const out = c.createGain(); out.gain.value = 0.9; out.connect(c.destination);
  AUDIO_NODES.push(out);
  const fade = c.createGain(); fade.gain.setValueAtTime(0,t0);
  fade.gain.linearRampToValueAtTime(1,t0+0.25);
  fade.gain.setValueAtTime(1,t0+dur-0.5);
  fade.gain.linearRampToValueAtTime(0,t0+dur);
  fade.connect(out); AUDIO_NODES.push(fade);
  const bed = (lo,hi,gain,brown)=>{
    const src=c.createBufferSource(); src.buffer=noiseBuf(c,dur+0.4,brown); src.loop=true;
    const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=(lo+hi)/2; f.Q.value=0.7;
    const g=c.createGain(); g.gain.value=gain;
    src.connect(f).connect(g).connect(fade); src.start(t0); src.stop(t0+dur);
    AUDIO_NODES.push(src); return {f,g};
  };
  const every=(step,fn,jitter)=>{ let t=t0+0.1, i=0;
    while(t<t0+dur-0.05){ fn(t,i++); t += step*(jitter?(0.7+Math.random()*0.6):1); } };

  switch(name){
    case 'rain':    { const b=bed(600,3000,0.22); const l=c.createOscillator(); const lg=c.createGain();
                      l.frequency.value=0.4; lg.gain.value=0.05; l.connect(lg).connect(b.g.gain); l.start(t0); l.stop(t0+dur); AUDIO_NODES.push(l); break; }
    case 'applause':  every(0.018,(t)=>grain(c,fade,t,0.05,1200,5000,0.16+Math.random()*0.16),true); bed(900,4000,0.05); break;
    case 'crowd':     bed(180,900,0.30,true); every(1.1,(t)=>tone(c,fade,t,0.5,140+rnd(120),0.035,'sawtooth',true),true); break;
    case 'siren':   { const o=c.createOscillator(); o.type='sine'; o.frequency.value=760;
                      const lfo=c.createOscillator(); lfo.frequency.value=0.42; const lg=c.createGain(); lg.gain.value=190;
                      lfo.connect(lg).connect(o.frequency); const g=c.createGain(); g.gain.value=0.13;
                      o.connect(g).connect(fade); o.start(t0); o.stop(t0+dur); lfo.start(t0); lfo.stop(t0+dur);
                      AUDIO_NODES.push(o,lfo); break; }
    case 'steps':     every(0.56,(t)=>grain(c,fade,t,0.11,90,420,0.5,true),true); break;
    case 'tick':      every(1.0,(t)=>grain(c,fade,t,0.02,2500,7000,0.32)); break;
    case 'engine':  { tone(c,fade,t0,dur,58,0.12,'sawtooth'); tone(c,fade,t0,dur,87,0.05,'sawtooth'); bed(90,420,0.13,true); break; }
    case 'wind':    { const b=bed(150,1400,0.30,true);
                      const lfo=c.createOscillator(); lfo.frequency.value=0.15; const lg=c.createGain(); lg.gain.value=500;
                      lfo.connect(lg).connect(b.f.frequency); lfo.start(t0); lfo.stop(t0+dur); AUDIO_NODES.push(lfo); break; }
    case 'beep':      every(0.82,(t)=>tone(c,fade,t,0.13,900,0.1,'square')); break;
    case 'water':     every(0.09,(t)=>grain(c,fade,t,0.14,700,2600,0.14),true); bed(500,2500,0.14); break;
    case 'bell':      every(2.6,(t)=>{ tone(c,fade,t,2.2,880,0.14,'sine',true); tone(c,fade,t,1.8,1320,0.06,'sine',true); tone(c,fade,t,1.2,2200,0.03,'sine',true); }); break;
    case 'typing':    every(0.13,(t)=>grain(c,fade,t,0.025,1800,6000,0.22+Math.random()*0.12),true); break;
    case 'heart':     every(0.92,(t)=>{ tone(c,fade,t,0.16,62,0.55,'sine',true); tone(c,fade,t+0.24,0.13,52,0.38,'sine',true); }); break;
    case 'coins':     every(0.34,(t)=>{ grain(c,fade,t,0.09,2500,7000,0.30); tone(c,fade,t,0.22,1900+rnd(900),0.09,'sine',true); },true); break;
    case 'whistle':   every(2.9,(t)=>tone(c,fade,t,0.55,2150,0.10,'sine')); break;
    case 'machine': { bed(200,1200,0.16,true); tone(c,fade,t0,dur,72,0.07,'sawtooth');
                      every(0.33,(t)=>grain(c,fade,t,0.08,300,1500,0.22,true)); break; }
    case 'paper':     every(0.42,(t)=>grain(c,fade,t,0.18,1500,6000,0.24),true); break;
    case 'alarm2':    every(1.0,(t,i)=>tone(c,fade,t,0.46,i%2?520:680,0.10,'square')); break;
    case 'gong':      every(3.1,(t)=>{ tone(c,fade,t,2.9,112,0.30,'sine',true); tone(c,fade,t,2.4,168,0.12,'sine',true); tone(c,fade,t,1.6,224,0.06,'sine',true); }); break;
    case 'platform':  bed(160,900,0.26,true); every(2.0,(t)=>tone(c,fade,t,0.45,88,0.22,'sine',true)); break;
    default:          bed(300,2000,0.2);
  }
  return true;
}

        <div class="controls"><button class="btn btn-ghost btn-sm" data-x>${t('hideCard')} ✓</button></div>

     document.body.appendChild(ov);

/* выбор стимула с учётом выбранной тематической рамки */
function pickFramed(bank){
  const f = S.frame;
  if(f && f!=='any'){ const sub = bank.filter(x=>x.f===f); if(sub.length) return pick(sub); }
  return pick(bank);
}

/* =====================================================================
   ЭКРАНЫ
   ===================================================================== */
function topbar(){
  return `<div class="topbar">
    <div class="brand"><span class="sp">✦</span> ${t('brand')}</div>
    <div class="spacer"></div>
    <div class="langsw">
      <button data-lang="ru" class="${LANG==='ru'?'on':''}">RU</button>
      <button data-lang="en" class="${LANG==='en'?'on':''}">EN</button>
    </div>
    <button class="coinbox" data-journal>📋 ${t('journal')} · <span data-jn>${S.log.length}</span></button>
  </div>`;
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-lang]');
  if(b){ setLang(b.dataset.lang); routeFromHash(); }
});

function frameBar(){
  const opts = ['any','N','T','S'].map(k=>{
    const label = k==='any' ? t('anyTheme') : (LANG==='ru'?FRAMES[k].ru:FRAMES[k].en);
    return `<button data-frame="${k}" class="${S.frame===k?'on':''}">${label}</button>`;
  }).join('');
  return `<div class="framebar"><span>${t('theme')}:</span><div class="sel">${opts}</div></div>`;
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-frame]');
  if(b){ S.frame = b.dataset.frame; try{ localStorage.setItem('tasklab.frame',S.frame); }catch(err){} routeFromHash(); }
});

function renderHub(){
  app.innerHTML = topbar() + `
    <div class="hero">
      <h1>${t('labTitleA')} <span class="accent">${t('labTitleB')}</span></h1>
      <p class="lead">${t('lead')}</p>
      <div class="meta">${t('meta')}</div>
    </div>
    ${frameBar()}
    <div class="grid" id="grid"></div>
    <div class="controls" style="margin-top:26px">
      <button class="btn btn-orange btn-sm" id="rand">${t('surprise')}</button>
    </div>
    <div class="foot">
      ${t('footCriteria')}<br>
      Габдуллина А.Ш., Гончарова Н.А. — Генеративный искусственный интеллект как инструмент
      проектирования коммуникативных заданий для развития спонтанной англоязычной речи студентов.<br>
      ${t('offline')}
    </div>`;
  const g = document.getElementById('grid');
  TASKS.forEach((task,i)=>{
    const c = h(`<div class="tcard"><span class="num">0${i+1}</span>
      <div class="ico">${task.ico}</div><h3>${L(task,'name')}</h3>
      <div class="sub">${L(task,'sub')}</div>
      <div class="skill">${L(task,'skill')}</div>
      <div class="time">${L(task,'time')}</div></div>`);
    c.onclick = ()=>go('intro',task);
    g.appendChild(c);
  });
  document.getElementById('rand').onclick = ()=>go('intro',pick(TASKS));
}

function renderIntro(task){
  const words = L(task,'name').split(' ');
  app.innerHTML = topbar() + `
    <div class="hero" style="padding-bottom:22px">
      <div style="font-size:38px">${task.ico}</div>
      <h1 style="font-size:clamp(26px,5vw,44px);margin-top:8px">${words.slice(0,-1).join(' ')}
        <span class="accent">${words.slice(-1)}</span></h1>
      <p class="lead">${L(task,'tag')}</p>
    </div>
    <div class="panel"><h4>${t('howToPlay')}</h4><ol class="steps" id="st"></ol></div>
    <div class="panel" style="margin-top:16px">
      <h4>◆ ${t('develops')}</h4>
      <div style="color:var(--muted);font-size:14.4px;line-height:1.6">${L(task,'skill')}</div>
      <h4 style="margin-top:20px">◆ ${t('promptLabel')}</h4>
      <div class="promptbox">«${L(task,'prompt')}»</div>
    </div>
    <div class="controls" style="margin-top:26px">
      <button class="btn btn-green" id="go">${t('start')}</button>
      <button class="btn btn-ghost btn-sm" id="back">← ${t('allTasks')}</button>
    </div>
    <div class="foot" id="foot"></div>`;
  if(location.protocol.indexOf('http')===0){
    document.getElementById('foot').innerHTML =
      `${t('directLink')}:<br><code style="color:#a78bfa;font-size:12px;word-break:break-all">${location.origin+location.pathname}#${task.id}</code>`;
  }
  const ol = document.getElementById('st');
  L(task,'rules').forEach(r=>ol.appendChild(h(`<li>${r}</li>`)));
  document.getElementById('go').onclick = ()=>go('task',task);
  document.getElementById('back').onclick = ()=>go('hub');
}

function renderTask(task){
  S.task = task.name; S.markers = 0;
  app.innerHTML = topbar() + `
    <div class="screen-head">
      <button class="btn btn-ghost btn-xs" id="back">← ${t('tasksShort')}</button>
      <div><h2>${task.ico} ${L(task,'name')}</h2>
        <div class="tag">${L(task,'sub')} · ${L(task,'time')}</div></div>
    </div>
    <div class="wrap-narrow" id="host"></div>`;
  document.getElementById('back').onclick = ()=>go('hub');
  task.play(document.getElementById('host'));
}

/* --- адрес страницы: /  — все задания,  /#emoji — сразу нужное --- */
let HASHLOCK = false;
function setHash(v){
  if((location.hash||'') === v) return;
  HASHLOCK = true; location.hash = v;
  setTimeout(()=>{ HASHLOCK = false; }, 0);
}
function taskByHash(){
  const id = (location.hash||'').replace(/^#/,'').trim().toLowerCase();
  return TASKS.find(x=>x.id===id) || null;
}
function routeFromHash(){
  const task = taskByHash();
  if(task) go('intro', task, true); else go('hub', null, true);
}
window.addEventListener('hashchange', ()=>{ if(!HASHLOCK) routeFromHash(); });

function go(screen, arg, silent){
  clearTimers();
  document.querySelectorAll('.stage[style*="fixed"]').forEach(e=>e.remove());
  refreshJournal();
  window.scrollTo(0,0);
  if(!silent) setHash(screen==='hub' ? '' : '#'+arg.id);
  if(screen==='hub')   return renderHub();
  if(screen==='intro') return renderIntro(arg);
  if(screen==='task')  return renderTask(arg);
}
try{ const f=localStorage.getItem('tasklab.frame'); if(f) S.frame=f; }catch(e){}
routeFromHash();
</script>
